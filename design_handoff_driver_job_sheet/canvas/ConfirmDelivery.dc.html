<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #fff; font-family: "IBM Plex Sans", system-ui, sans-serif; color: oklch(13% 0.028 261.692); -webkit-font-smoothing: antialiased; }
    a { color: oklch(13% 0.028 261.692); text-decoration: none; }
    a:hover { color: oklch(64% 0.19 48); }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fff; position: relative; overflow: hidden;">

  <div style="filter: blur(1.5px); opacity: 0.5;">
    <div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-bottom: 1px solid oklch(92.8% 0.006 264.531);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="oklch(13% 0.028 261.692)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <div style="font-size: 17px; font-weight: 600; letter-spacing: -0.015em;">Job sheet</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 20px; padding: 20px 16px;">
      <div style="border: 1px solid oklch(92.8% 0.006 264.531); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: oklch(44.6% 0.03 256.802);">GE-48204</div>
          <div style="border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 600; background: oklch(93.2% 0.032 255.585); color: oklch(42.4% 0.199 265.638);">In transit</div>
        </div>
        <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 26px; font-weight: 600;">₾50.55</div>
      </div>
      <div style="border: 1px solid oklch(92.8% 0.006 264.531); border-radius: 14px; height: 120px;"></div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.5);"></div>

  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 342px; background: #fff; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 20px 50px rgba(0,0,0,0.25);">

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">Confirm delivery</div>
      <div style="font-size: 13px; color: oklch(44.6% 0.03 256.802); line-height: 1.5;">This ends the job and cannot be undone.</div>
    </div>

    <div style="border: 1px solid oklch(92.8% 0.006 264.531); border-radius: 8px; background: oklch(96.7% 0.003 264.542); padding: 14px; display: grid; grid-template-columns: 76px 1fr; gap: 8px 12px; font-size: 13px;">
      <div style="color: oklch(44.6% 0.03 256.802);">Load</div>
      <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace;">GE-48204</div>
      <div style="color: oklch(44.6% 0.03 256.802);">Drop-off</div>
      <div style="line-height: 1.4;">აღმაშენებლის ხეივანი 188ა</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <label style="font-size: 13px; font-weight: 500;">Waiting time</label>
      <div style="display: flex; align-items: center; gap: 10px;">
        <input type="text" value="0" style="width: 88px; height: 44px; border: 1px solid oklch(92.8% 0.006 264.531); border-radius: 8px; background: transparent; padding: 0 12px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 15px; font-variant-numeric: tabular-nums; color: oklch(13% 0.028 261.692); box-sizing: border-box;">
        <div style="font-size: 13px; color: oklch(44.6% 0.03 256.802);">minutes</div>
      </div>
      <div style="font-size: 12px; color: oklch(44.6% 0.03 256.802); line-height: 1.45;">Whole minutes spent waiting at either stop. Enter 0 if none.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <label style="font-size: 13px; font-weight: 500;">Received by (optional)</label>
      <input type="text" placeholder="Name of whoever took the goods" style="height: 44px; border: 1px solid oklch(92.8% 0.006 264.531); border-radius: 8px; background: transparent; padding: 0 12px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; color: oklch(13% 0.028 261.692); box-sizing: border-box;">
    </div>

    <div style="display: flex; gap: 10px; padding-top: 2px;">
      <a href="#" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 44px; border: 1px solid oklch(92.8% 0.006 264.531); border-radius: 8px; background: #fff; font-size: 14px; font-weight: 500;">Cancel</a>
      <a href="#" style="flex: 1.6; display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 8px; background: oklch(13% 0.028 261.692); color: #fff; font-size: 14px; font-weight: 500;">Confirm delivery</a>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
